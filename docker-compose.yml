services:
  chaosforge:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - chaosforge-data:/data
    extra_hosts:
      # Makes host.docker.internal resolvable on Linux engines too (built in on Docker Desktop).
      - "host.docker.internal:host-gateway"
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/data/chaosforge.db
      - InferRouter__BaseUrl=${INFERROUTER_BASE_URL:?INFERROUTER_BASE_URL must be set in .env.docker}
      - Agents__PollingIntervalMs=${POLLING_INTERVAL_MS:-3000}

volumes:
  chaosforge-data:
